name: Ping IndexNow on blog change

on:
  push:
    branches: [main]
    paths:
      - "blogs.txt"
      - "changelog.txt"
      - "status.txt"

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping IndexNow directly
        env:
          INDEXNOW_KEY: ae335e8649443444bdc862971d8fa09b
        run: |
          set -euo pipefail

          STATIC_PAGES=("" "features" "changelog" "blog" "team" "status" "dashboard")

          URL_LIST=()
          for page in "${STATIC_PAGES[@]}"; do
            URL_LIST+=("https://seshy.lol/${page}")
          done

          if [ -f blogs.txt ]; then
            while IFS= read -r id; do
              [ -n "$id" ] && URL_LIST+=("https://seshy.lol/blog/${id}")
            done < <(grep '^ID:' blogs.txt | sed 's/^ID:[[:space:]]*//; s/[[:space:]]*$//')
          fi

          URL_JSON=$(printf '%s\n' "${URL_LIST[@]}" | jq -R . | jq -s .)

          PAYLOAD=$(jq -n \
            --arg host "seshy.lol" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://seshy.lol/${INDEXNOW_KEY}.txt" \
            --argjson urls "$URL_JSON" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urls}')

          echo "Submitting ${#URL_LIST[@]} URLs to IndexNow..."

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            -w "\nHTTP %{http_code}\n" \
            --fail-with-body
